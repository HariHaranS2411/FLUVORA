[build]
  base = "frontend"
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Client-side routing (react-router createBrowserRouter): serve the SPA for
# any path that isn't a real file so deep links like /alerts don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
