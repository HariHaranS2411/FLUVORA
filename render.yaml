# FLUVORA — Render Blueprint
# Deploys both halves of the app:
#   fluvora-api : FastAPI backend (web service) + persistent disk for SQLite
#   fluvora-web : React/Vite frontend (static site with SPA rewrites)
#
# Deploy: push this repo to GitHub, then in Render "New +" > "Blueprint" and
# select the repo. During the initial sync Render prompts for every
# `sync: false` value below — the two that matter:
#   CORS_ORIGINS  (fluvora-api) -> the frontend's public URL, comma-separated,
#                                  e.g. https://fluvora-web.onrender.com
#   VITE_API_BASE (fluvora-web) -> the backend's public URL INCLUDING https://,
#                                  e.g. https://fluvora-api.onrender.com
# (Render cannot auto-fill these: service-to-service host references resolve to
# Render's private network, which a browser can't reach. VITE_API_BASE is baked
# into the JS bundle at build time, so changing it later triggers a rebuild.)

previews:
  generation: off

services:
  # ---------------------------------------------------------------- backend
  # FREE-TIER DEMO MODE: no persistent disk, so the SQLite database lives on
  # the instance's ephemeral filesystem and resets on every restart/spin-down
  # (free instances sleep after ~15 min idle). The app handles this itself:
  # at startup it re-seeds districts/events/model registry and runs one
  # immediate refresh cycle when the database is empty (see main.py lifespan).
  # Real live nowcast works; long-term history does not survive restarts.
  # For full persistence: add a `disk:` block (paid plan) and set
  # DATABASE_URL=sqlite:////var/data/app.db (see README "Render").
  - type: web
    name: fluvora-api
    runtime: python
    plan: free
    region: singapore          # closest region to India; frontend is a global CDN
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    buildFilter:
      paths:
        - backend/**
        - data/**
        - database/**
        - ml/**
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: CORS_ORIGINS
        sync: false            # frontend public URL(s), comma-separated
      - key: OPEN_METEO_API_KEY
        sync: false            # optional customer key; Archive requires Professional plan
      # Optional upstream credentials (all sources work without them; see
      # .env.example / DATA_SOURCE_MATRIX.md).
      - key: NASA_POWER_API_KEY
        sync: false
      - key: RELIEFWEB_APPNAME
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      # Web Push for HIGH-risk browser alerts. Generate once with
      # app/services/webpush.py:generate_vapid_keys; leave empty to disable.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  # --------------------------------------------------------------- frontend
  - type: web
    name: fluvora-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      # SPA fallback: serve index.html for client-side router paths
      # (existing static files like /assets/* and /service-worker.js win first).
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_BASE
        sync: false            # backend public URL incl. https://
